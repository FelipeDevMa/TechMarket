<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMarket - Produto</title>
    <link rel="icon" href="logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0a0a0f; color: #f0f0f0; }
        header { background: #111116; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid #1e1e2a; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #00bfff; font-size: 28px; font-weight: 700; }
        .logo-area img { width: 45px; }
        .voltar { color: #00bfff; text-decoration: none; font-size: 16px; }
        .icone-carrinho { position: relative; color: white; font-size: 24px; cursor: pointer; background: none; border: none; text-decoration: none; }
        .carrinho-contador { position: absolute; top: -10px; right: -12px; background: #ff4444; color: white; font-size: 12px; font-weight: bold; width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 30px; display: flex; gap: 50px; flex-wrap: wrap; }
        .produto-imagem { flex: 1; min-width: 350px; }
        .produto-imagem img { width: 100%; border-radius: 20px; border: 1px solid #222; }
        .produto-info { flex: 1; min-width: 350px; }
        .produto-info h1 { font-size: 32px; margin-bottom: 15px; }
        .produto-info .preco { color: #ff6500; font-size: 42px; font-weight: bold; margin-bottom: 25px; }
        .produto-info .descricao { color: #ccc; line-height: 1.7; font-size: 17px; margin-bottom: 25px; }
        .especificacoes { background: #15151d; padding: 20px; border-radius: 16px; border: 1px solid #222; margin-bottom: 25px; }
        .especificacoes h3 { color: #ff6500; margin-bottom: 15px; }
        .especificacoes ul { list-style: none; }
        .especificacoes li { padding: 8px 0; border-bottom: 1px solid #222; color: #ccc; }
        .especificacoes li::before { content: '▸ '; color: #ff6500; }
        .btn-comprar { display: inline-block; padding: 16px 40px; background: #ff6500; color: white; font-weight: bold; font-size: 20px; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-comprar:hover { background: #ff7a22; transform: translateY(-3px); }
        .mensagem { margin-top: 15px; color: #28a745; font-weight: bold; }
        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 0 15px; }
            .produto-imagem, .produto-info { min-width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-area">
        <img src="logo.png" alt="TechMarket">
        TechMarket
    </a>
    <a href="index.html" class="voltar">← Voltar para loja</a>
    <a href="checkout.html" style="position:relative; text-decoration:none;">
        <button class="icone-carrinho">
            🛒
            <span class="carrinho-contador" id="carrinhoContador">0</span>
        </button>
    </a>
</header>

<div class="container" id="produtoContainer"></div>

<script src="produtos.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const idProduto = urlParams.get('id');
    const produto = getProdutoPorId(idProduto);
    const container = document.getElementById('produtoContainer');

    if (!produto) {
        container.innerHTML = `
            <div style="text-align:center;width:100%;">
                <h1>Produto não encontrado</h1>
                <a href="index.html" style="color:#ff6500;font-size:18px;">← Voltar para loja</a>
            </div>
        `;
    } else {
        document.title = `TechMarket - ${produto.nome}`;
        container.innerHTML = `
            <div class="produto-imagem">
                <img src="${produto.img}" alt="${produto.nome}">
            </div>
            <div class="produto-info">
                <h1>${produto.nome}</h1>
                <div class="preco">R$ ${produto.preco.toLocaleString()}</div>
                <p class="descricao">${produto.descricao}</p>
                <div class="especificacoes">
                    <h3>Especificações Técnicas</h3>
                    <ul>
                        ${produto.especificacoes.map(e => `<li>${e}</li>`).join('')}
                    </ul>
                </div>
                <button class="btn-comprar" onclick="comprar()">🛍 Comprar</button>
                <div class="mensagem" id="msgCompra"></div>
            </div>
        `;
    }

    function comprar() {
        adicionarAoCarrinho(produto.id, produto.nome, produto.preco);
        atualizarContadorCarrinho();
        document.getElementById('msgCompra').textContent = '✅ Produto adicionado ao carrinho!';
        setTimeout(() => document.getElementById('msgCompra').textContent = '', 3000);
    }

    atualizarContadorCarrinho();
</script>
</body>
</html>
